name: Build and publish development Docker images

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development version
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push development scraper
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/chimeralaboratories/availability-scraper:dev

      - name: Build and push development browser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/browser/Dockerfile
          push: true
          tags: ghcr.io/chimeralaboratories/availability-browser:dev
