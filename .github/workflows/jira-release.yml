name: Create release from Jira

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version from Jira, e.g. v1.0.0"
        required: true
        type: string

      description:
        description: "Release notes from Jira"
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create release notes file
        env:
          VERSION: ${{ inputs.version }}
          JIRA_DESCRIPTION: ${{ inputs.description }}
        run: |
          {
            echo "# $VERSION"
            echo

            if [ -n "$JIRA_DESCRIPTION" ]; then
              echo "## Release notes"
              echo
              echo "$JIRA_DESCRIPTION"
              echo
            fi

            echo "## Changes"
            echo
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
          else
            gh release create "$VERSION" \
              --target main \
              --title "$VERSION" \
              --notes-file release-notes.md \
              --generate-notes
          fi

      - name: Trigger production Docker build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run docker-build.yml \
            --ref main \
            -f release_tag="$VERSION"