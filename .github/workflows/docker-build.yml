name: Build and publish production Docker images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build, e.g. 2026.10 or 2026.10.1"
        required: true
        type: string

      release_sha:
        description: "Exact verified Git commit for this release"
        required: true
        type: string

concurrency:
  group: docker-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SHA: ${{ inputs.release_sha }}

    steps:
      - name: Validate release inputs
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])(\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            echo "::error::Expected CalVer format YYYY.MM or YYYY.MM.PATCH"
            exit 1
          fi

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid release SHA: $RELEASE_SHA"
            exit 1
          fi

      - name: Checkout released version
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify release source
        run: |
          git fetch origin --tags --force

          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          CHECKOUT_SHA="$(git rev-parse HEAD)"

          echo "Release tag:  $RELEASE_TAG"
          echo "Expected SHA: $RELEASE_SHA"
          echo "Tag SHA:      $TAG_SHA"
          echo "Checkout SHA: $CHECKOUT_SHA"

          if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::REFUSING PRODUCTION BUILD"
            echo "::error::$RELEASE_TAG points to $TAG_SHA"
            echo "::error::Expected $RELEASE_SHA"
            exit 1
          fi

          if [ "$CHECKOUT_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::REFUSING PRODUCTION BUILD"
            echo "::error::Checked-out source is $CHECKOUT_SHA"
            echo "::error::Expected $RELEASE_SHA"
            exit 1
          fi

          echo "Release source verification passed."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scraper
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/chimeralaboratories/availability-scraper:${{ env.RELEASE_TAG }}
            ghcr.io/chimeralaboratories/availability-scraper:prod

      - name: Build and push browser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/browser/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/chimeralaboratories/availability-browser:${{ env.RELEASE_TAG }}
            ghcr.io/chimeralaboratories/availability-browser:prod
