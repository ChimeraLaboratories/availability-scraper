name: Build and publish production Docker images

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build, e.g. v1.0.0"
        required: true
        type: string

concurrency:
  group: docker-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}

    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout released version
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scraper
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chimeralaboratories/availability-scraper:prod
            ghcr.io/chimeralaboratories/availability-scraper:${{ env.RELEASE_TAG }}

      - name: Build and push browser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/browser/Dockerfile
          push: true
          tags: |
            ghcr.io/chimeralaboratories/availability-browser:prod
            ghcr.io/chimeralaboratories/availability-browser:${{ env.RELEASE_TAG }}