name: Build and publish production Docker images

on:
  release:
    types: [published]

concurrency:
  group: docker-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout released version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scraper
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chimeralaboratories/availability-scraper:prod
            ghcr.io/chimeralaboratories/availability-scraper:${{ github.event.release.tag_name }}

      - name: Build and push browser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/browser/Dockerfile
          push: true
          tags: |
            ghcr.io/chimeralaboratories/availability-browser:prod
            ghcr.io/chimeralaboratories/availability-browser:${{ github.event.release.tag_name }}
