<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Availability Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="manifest" href="/manifest.webmanifest">

    <meta name="theme-color" content="#ffffff">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Availability">

    <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<div class="app-shell">
    <main class="page page-single">
        <section class="list-card compact-card">
            <div class="list-card-header compact-header">
                <div>
                    <h2 id="availabilityTitle">Availability List</h2>
                </div>

                <div class="topbar-right">
                    <div id="status" class="status-pill status-idle">Idle</div>
                    <button id="refreshBtn" class="btn btn-primary">Update</button>

                    <a
                            href="/admin"
                            class="admin-link"
                            aria-label="Open administration"
                            title="Administration"
                    >⚙︎</a>
                </div>
            </div>

            <div id="systemAnnouncement" class="system-announcement hidden" role="status" aria-live="polite">
                <span id="systemAnnouncementMessage"></span>
            </div>

            <div class="availability-column-headings" aria-hidden="true">
                <span>Appointment</span>
                <span>Next appointment</span>
                <span>Status</span>
            </div>

            <div id="list" class="availability-list"></div>
        </section>
    </main>
</div>

<script type="module" src="/app.js?v=push6"></script>
</body>
</html>
