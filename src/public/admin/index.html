<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1"
  >

  <title>Availability Admin</title>

  <link
          rel="stylesheet"
          href="/admin/admin.css"
  >
</head>

<body>
  <main class="admin-shell">
    <section class="admin-card">

      <header class="admin-header">
        <p class="eyebrow">
          ChimeraLabs
        </p>

        <h1>
          Availability Admin
        </h1>

        <p id="subtitle" class="subtitle">
          Checking authentication...
        </p>
      </header>

      <div id="loadingView" class="view">
        <div class="spinner"></div>
      </div>

      <div id="loginView" class="view hidden">
        <form id="loginForm" autocomplete="off">
          <label for="totpCode">
            Authenticator code
          </label>

          <input id="totpCode" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required>

          <p id="loginError" class="message error hidden"></p>

          <button id="loginButton" type="submit">
            Sign in
          </button>
        </form>
      </div>

      <div id="adminView" class="view hidden">
        <div class="status-row">
          <div>
            <span class="status-dot"></span>
            Authenticated
          </div>

          <button id="logoutButton" class="secondary-button" type="button">
            Log out
          </button>
        </div>

        <div class="admin-content">
          <h2>
            System overview
          </h2>

          <div class="status-grid">

            <article class="status-card">
              <p class="status-label">
                Admin session
              </p>

              <strong>
                Authenticated
              </strong>

              <p class="status-description">
                Secure TOTP session active.
              </p>
            </article>

            <article class="status-card">
              <p class="status-label">
                Browser
              </p>

              <strong id="browserStatusValue">
                Loading...
              </strong>

              <p id="browserStatusMessage" class="status-description">
                Checking browser status...
              </p>
            </article>

            <article class="status-card">
              <p class="status-label">
                Readiness
              </p>

              <strong id="browserReadyValue">
                Loading...
              </strong>

              <p id="browserReadyMessage" class="status-description">
              Waiting for browser status...
              </p>
            </article>

          </div>

        </div>
      </div>

    </section>

  </main>

  <script src="/admin/admin.js" defer></script>
</body>
</html>
